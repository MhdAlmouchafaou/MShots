plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mshots'
version = '1.0.0'

android {
  namespace "expo.modules.mshots"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.webkit:webkit:1.12.1"
}
